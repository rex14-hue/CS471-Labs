{% extends "layouts/base.html" %}

{% block title %}Search Results{% endblock title %}

{% block content %}
  <h1>Search Results</h1>

  <ul>
    {% for book in books %}
      <li>
        <strong>{{ book.title }}</strong>
        — {{ book.author }}
      </li>
    {% empty %}
      <li>No books found.</li>
    {% endfor %}
  </ul>

  <a href="{% url 'books.search' %}">Search again</a>
{% endblock content %}
